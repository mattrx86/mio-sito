baseURL = "https://mattiariccadonna.com/"
theme   = "nostyleplease"

# Lingua di default
defaultContentLanguage         = "it"
defaultContentLanguageInSubdir = false   # italiano senza /it/ nell'URL

[languages]
  [languages.it]
    languageCode = "it-IT"
    languageName = "Italiano"
    title        = "Mattia Riccadonna"
    weight       = 1
    [languages.it.params]
      description = "Pittore su tela, ingegnere, padre. Dipingo dal 2002. Olio, acquerello, sperimentazione."
      keywords    = ["pittore", "arte", "pittura ad olio", "acquerello", "Mattia Riccadonna", "Trentino", "illustrazione"]

  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    title        = "Mattia Riccadonna"
    weight       = 2
    contentDir   = "content/en"
    [languages.en.params]
      description = "Painter, engineer, father. Oil on canvas, watercolour, experimentation. Archive of works since 2002."
      keywords    = ["painter", "art", "oil painting", "watercolour", "Mattia Riccadonna", "Italian artist", "Trentino"]

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    codeFences = true
    style      = 'rrt'
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false

[params]
  [params.theme_config]
    appearance        = "auto"
    back_home_text    = "← indietro"
    date_format       = "2006-01-02"
    isListGroupByDate = true
    isShowFooter      = true
    show_description  = true

# SEO — sitemap
[sitemap]
  changefreq = "weekly"
  priority   = 0.5
  filename   = "sitemap.xml"
