baseURL = "https://mattiariccadonna.com/"
theme   = "nostyleplease"

defaultContentLanguage         = "it"
defaultContentLanguageInSubdir = false

[languages]
  [languages.it]
    languageCode = "it-IT"
    languageName = "Italiano"
    title        = "Mattia Riccadonna, strati."
    weight       = 1
    [languages.it.params]
      seo_title   = "Mattia Riccadonna — Pittore trentino, olio su tela dal 1999"
      description = "Mattia Riccadonna, pittore trentino di Comano Terme dal 1999: olio su tela, acquerello e disegno. Archivio di opere, dipinti recenti, mostre e rassegna stampa."
      keywords    = ["Mattia Riccadonna", "pittore trentino", "pittura ad olio", "disegno", "arte Trentino", "quadri originali", "quadri in vendita", "acquisto quadri", "opere d'arte originali", "pittore Comano Terme", "arte contemporanea trentina", "quadri olio su tela"]

# Solo i tag: la tassonomia "categories" non era usata e generava una pagina vuota
[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    style      = "rrt"
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false

[params]
  author    = "Mattia Riccadonna"
  copyright = "Mattia Riccadonna"

  # Immagine di condivisione usata quando una pagina non ha "image" nel frontmatter
  defaultImage = "/img/og-home.jpg"

  # Profili ufficiali collegati alla persona (dati strutturati schema.org "sameAs")
  sameAs = [
    "https://www.instagram.com/riccadonna_art/",
    "https://www.ebay.it/usr/mattia_riccadonna_art"
  ]

  [params.theme_config]
    appearance        = "light"
    back_home_text    = "← indietro"
    date_format       = "02-01-2006"
    isListGroupByDate = true
    isShowFooter      = true
    show_description  = false

# Elaborazione immagini (versioni WebP generate dal render hook e dalla galleria)
[imaging]
  resampleFilter = "Lanczos"
  quality        = 82

# Le immagini di static/img sono rese disponibili anche come "risorse" Hugo,
# così possono essere ridimensionate e convertite in WebP.
# Gli originali restano pubblicati come prima.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/img"
    target = "assets/img"
  [[module.mounts]]
    source = "static"
    target = "static"

[sitemap]
  filename = "sitemap.xml"

[mediaTypes]
  [mediaTypes."application/xml"]
    suffixes = ["xml"]

[outputFormats]
  [outputFormats.ImageSitemap]
    mediaType    = "application/xml"
    baseName     = "sitemap-images"
    isPlainText  = true
    notAlternative = true

[outputs]
  home    = ["HTML", "RSS", "ImageSitemap"]
  section = ["HTML", "RSS"]
  page    = ["HTML"]
