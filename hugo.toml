baseURL = "https://mattiariccadonna.com/"
theme   = "nostyleplease"

defaultContentLanguage         = "it"
defaultContentLanguageInSubdir = false

[languages]
  [languages.it]
    languageCode = "it-IT"
    languageName = "Italiano"
    title        = "Mattia Riccadonna, strati."
    weight       = 1
    [languages.it.params]
      seo_title   = "Mattia Riccadonna — Pittore e illustratore trentino"
      description = "Pittore, illustratore e ingegnere. Dipingo dal 1999. Olio su tela, acquerello, sperimentazione. Archivio di opere, mostre e documenti dal 1999 ad oggi."
      keywords    = ["pittore", "pittura ad olio", "acquerello", "Mattia Riccadonna", "Trentino", "arte contemporanea", "illustrazione", "ingegnere pittore", "pittore Trentino", "arte Trentino", "quadri originali"]

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    style      = "rrt"
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false

[params]
  author    = "Mattia Riccadonna"
  copyright = "Mattia Riccadonna"

  [params.theme_config]
    appearance        = "light"
    back_home_text    = "← indietro"
    date_format       = "02-01-2006"
    isListGroupByDate = true
    isShowFooter      = true
    show_description  = false

[sitemap]
  changefreq = "weekly"
  priority   = 0.8
  filename   = "sitemap.xml"

[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page    = ["HTML"]
