baseURL = "https://mattiariccadonna.com/"
theme   = "nostyleplease"

defaultContentLanguage         = "it"
defaultContentLanguageInSubdir = false

[languages]
  [languages.it]
    languageCode = "it-IT"
    languageName = "Italiano"
    title        = "Mattia Riccadonna, strati."
    weight       = 1
    [languages.it.params]
      description = "Pittore, disegnatore, padre, ingegnere. Dipingo dal 1999. Olio su tela, acquerello, sperimentazione. Archivio di opere, mostre e documenti dal 2002 ad oggi."
      keywords    = ["pittore", "pittura ad olio", "acquerello", "Mattia Riccadonna", "Trentino", "arte contemporanea", "illustrazione", "ingegnere pittore"]

  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    title        = "Mattia Riccadonna, layers."
    weight       = 2
    contentDir   = "content/en"
    [languages.en.params]
      description = "Painter, draughtsman, father, engineer. Painting since 1999. Oil on canvas, watercolour, experimentation. Archive of works, exhibitions and documents since 2002."
      keywords    = ["painter", "oil painting", "watercolour", "Mattia Riccadonna", "Italian artist", "Trentino", "illustration"]

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    style      = "rrt"
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false

[params]
  [params.theme_config]
    appearance        = "auto"
    back_home_text    = "..indietro"
    date_format       = "02-01-2006"
    isListGroupByDate = true
    isShowFooter      = true
    show_description  = false

[sitemap]
  changefreq = "weekly"
  priority   = 0.5
  filename   = "sitemap.xml"
