[build]
  publish = "public"
  command = "rm -rf themes/typo themes/nostyleplease && git clone https://github.com/hanwenguo/hugo-theme-nostyleplease themes/nostyleplease && printf 'a { color: #6B1ACC !important; } a:hover { color: #9B4DFF !important; background-color: #EDE9FE; } @media (prefers-color-scheme: dark) { body { filter: none !important; } }' >> themes/nostyleplease/assets/css/main.scss && hugo --minify"

[build.environment]
  HUGO_VERSION       = "0.128.0"
  HUGO_ENABLEGITINFO = "true"

[[redirects]]
  from   = "https://www.mattiariccadonna.com/*"
  to     = "https://mattiariccadonna.com/:splat"
  status = 301
  force  = true
