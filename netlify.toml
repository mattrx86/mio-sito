[build]
  publish = "public"
  command = "git submodule update --init --recursive || true && rm -rf themes/typo && git clone https://github.com/hanwenguo/hugo-theme-nostyleplease themes/nostyleplease && hugo --minify"

[build.environment]
  HUGO_VERSION       = "0.128.0"
  HUGO_ENABLEGITINFO = "true"

[[redirects]]
  from   = "https://www.mattiariccadonna.com/*"
  to     = "https://mattiariccadonna.com/:splat"
  status = 301
  force  = true
