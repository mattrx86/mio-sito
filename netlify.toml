# Feed RSS principale: utile ai lettori di feed, non serve nei risultati di Google
[[headers]]
  for = "/index.xml"
  [headers.values]
    X-Robots-Tag = "noindex"

# Immagini: 7 giorni di cache nel browser. I file generati da Hugo hanno l'impronta
# (hash) nel nome; per gli altri, una settimana è un compromesso sicuro se ne sostituisci uno.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Pannello delle opere (/admin/): mai nei risultati di Google, sempre la versione aggiornata
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
    X-Frame-Options = "DENY"
