[build]
  publish = "public"
  command = """rm -rf themes/typo themes/nostyleplease && git clone https://github.com/mattrx86/hugo-theme-nostyleplease themes/nostyleplease && hugo --minify"""

[build.environment]
  HUGO_VERSION      = "0.128.0"
  HUGO_ENABLEGITINFO = "true"

# --- Redirect 301 per vecchi URL di singole opere (rinominate) ---
[[redirects]]
  from = "/archivio/catenaccio-a-glolo/"
  to = "/archivio/catenaccio-a-villa-banale/"
  status = 301
  force = true

