{{- /*
  Pallino di disponibilità (aggancia al bordo basso-destro della foto).
  Uso: partial "stato-punto.html" true   -> bianco (disponibile)
       partial "stato-punto.html" false  -> rosso (non disponibile)
  Stile in assets/css/override.css (.stato-punto).
*/ -}}
{{- if . -}}
<span class="stato-punto stato-punto--si" role="img" aria-label="Opera disponibile" title="disponibile"></span>
{{- else -}}
<span class="stato-punto stato-punto--no" role="img" aria-label="Opera non disponibile" title="non disponibile"></span>
{{- end -}}
