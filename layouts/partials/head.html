<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ .Title }}</title>
<link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="{{ "index.xml" | absURL }}">
{{- with .Site.Params.description }}
<meta name="description" content="{{ . }}">
{{- end }}
{{- with .Site.Params.keywords }}
<meta name="keywords" content="{{ delimit . ", " }}">
{{- end }}
<meta property="og:title" content="{{ .Title }}" />
<meta property="og:type" content="website" />
{{ $mainCSS := resources.Get "css/main.css" }}
{{ if $mainCSS }}<link rel="stylesheet" href="{{ $mainCSS.Permalink }}">{{ end }}
{{ partial "theme-style.html" . }}
<style>
:root { --link-color: #7A2E2E; --link-hover: #B84A2A; --link-bg-hover: #F5EDE8; }
[data-theme="dark"] { --link-color: #D4907A; --link-hover: #EDB99A; --link-bg-hover: #2A1A14; }
a { color: var(--link-color) !important; text-decoration-color: transparent; border-radius: 2px; padding: 0 2px; transition: color .15s, background-color .15s; }
a:hover { color: var(--link-hover) !important; background-color: var(--link-bg-hover); }
#theme-toggle { position: fixed; top: 1rem; right: 1rem; cursor: pointer; font-size: .75rem; opacity: .4; background: none; border: 1px solid currentColor; padding: .2rem .45rem; border-radius: 2px; color: inherit; transition: opacity .15s; z-index: 100; }
#theme-toggle:hover { opacity: 1; }
</style>
<script>
(function(){var s=localStorage.getItem('theme');if(s)document.documentElement.setAttribute('data-theme',s);})();
function toggleTheme(){var h=document.documentElement;var c=h.getAttribute('data-theme');var n=c==='dark'?'light':'dark';h.setAttribute('data-theme',n);localStorage.setItem('theme',n);}
</script>
<button id="theme-toggle" onclick="toggleTheme()" title="◐"></button>
